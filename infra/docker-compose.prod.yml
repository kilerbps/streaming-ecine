# Production sur le VPS ecine.art (ADR-0016, docs/deploiement-vps.md) : site, API (deux instances),
# worker, PostgreSQL, Redis, derrière Caddy. Seul Caddy est exposé (80, 443 TCP et UDP).
# Secrets : /etc/ecine/*.env et /etc/ecine/secrets/ (dossier réservé à root, infra/secrets.sh),
# jamais dans le dépôt.
# Répartition calée sur 2 vCPU et 7,7 Go (+ 4 Go de swap) : le site et l'API d'abord, le
# transcodage ensuite.
#
#   sudo infra/deploy.sh     # construit, migre, remplace les instances une à une, vérifie
name: ecine

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ['no-new-privileges:true']
  cap_drop: [ALL]
  init: true
  logging:
    driver: json-file
    options: { max-size: '10m', max-file: '5' }

x-api-build: &api-build
  context: ..
  dockerfile: apps/api/Dockerfile

services:
  caddy:
    <<: *hardening
    image: caddy:2-alpine
    cap_add: [NET_BIND_SERVICE]
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      # Accès au site et à l'API : « ouverte », ou « cloudflare » une fois le proxy actif.
      CADDY_ORIGIN: ${CADDY_ORIGIN:-ouverte}
    volumes:
      # Dossier entier (pas un fichier) : une mise à jour du dépôt est vue par `caddy reload`.
      - ./caddy:/etc/caddy:ro
      - storage:/data/storage:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge, app]
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256M }
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

  web:
    <<: *hardening
    image: ecine-web:${TAG:-latest}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # Clé de site Turnstile (publique) : figée dans le JavaScript du navigateur.
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_VIEW_TRANSITIONS: ${VIEW_TRANSITIONS:-0}
    env_file: /etc/ecine/web.env
    environment:
      NODE_OPTIONS: --max-old-space-size=768
    read_only: true
    tmpfs: ['/tmp']
    volumes:
      - next-cache:/app/apps/web/.next/cache
    networks: [app]
    deploy:
      resources:
        limits: { cpus: '1', memory: 1G }
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1']
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 5

  api:
    <<: *hardening
    image: ecine-api:${TAG:-latest}
    build:
      <<: *api-build
      target: api
    env_file: /etc/ecine/api.env
    environment:
      STORAGE_DIR: /data/storage
      NODE_OPTIONS: --max-old-space-size=384
    read_only: true
    tmpfs: ['/tmp']
    volumes:
      - storage:/data/storage
    networks: [app, data]
    deploy:
      # Deux instances : mises à jour sans coupure, une instance qui tombe n'arrête pas le site.
      replicas: 2
      resources:
        limits: { cpus: '0.75', memory: 512M }
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4000/health >/dev/null || exit 1']
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *hardening
    image: ecine-worker:${TAG:-latest}
    build:
      <<: *api-build
      target: worker
    env_file: /etc/ecine/api.env
    environment:
      STORAGE_DIR: /data/storage
    read_only: true
    tmpfs: ['/tmp']
    volumes:
      - storage:/data/storage
    networks: [app, data]
    # Priorité basse : sous charge, le site et l'API passent avant le transcodage.
    cpu_shares: 256
    # Laisse le transcodage en cours se ranger (la tâche est reprise au redémarrage).
    stop_grace_period: 30s
    deploy:
      resources:
        limits: { cpus: '1', memory: 2G }
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  migrate:
    image: ecine-migrate:${TAG:-latest}
    build:
      <<: *api-build
      target: migrate
    env_file: /etc/ecine/api.env
    networks: [data]
    profiles: [tools]

  postgres:
    <<: *hardening
    image: postgres:18-alpine
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_USER: ecine
      POSTGRES_DB: ecine
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    # Réglages pour 2 Go de plafond (SSD, peu de connexions : 2 API + worker, pools de 10).
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=40
      - -c
      - random_page_cost=1.1
      - -c
      - wal_compression=on
    secrets: [postgres_password]
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [data]
    shm_size: 256m
    deploy:
      resources:
        limits: { cpus: '1', memory: 2G }
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ecine -d ecine']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    <<: *hardening
    image: redis:8-alpine
    # Utilisateur de l'image (propriétaire de /data) : le fichier secret est lisible par tous dans le
    # conteneur, mais son dossier sur l'hôte (/etc/ecine/secrets) est réservé à root.
    user: redis
    # Mot de passe lu depuis un fichier secret ; noeviction : les files BullMQ ne doivent pas être évincées.
    command:
      [
        'sh',
        '-c',
        'exec redis-server --requirepass "$$(cat /run/secrets/redis_password)" --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes',
      ]
    secrets: [redis_password]
    volumes:
      - redisdata:/data
    networks: [data]
    deploy:
      resources:
        limits: { cpus: '0.25', memory: 384M }
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'redis-cli -a "$$(cat /run/secrets/redis_password)" --no-auth-warning ping | grep PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

secrets:
  postgres_password:
    file: /etc/ecine/secrets/postgres_password
  redis_password:
    file: /etc/ecine/secrets/redis_password

volumes:
  pgdata:
  redisdata:
  storage:
  next-cache:
  caddy-data:
  caddy-config:

networks:
  # edge : Internet ↔ Caddy, en IPv4 et IPv6. L'IPv6 du réseau garde l'adresse réelle des visiteurs
  # IPv6 (sans elle, Docker les relaie et Caddy ne voit que la passerelle). app : Caddy ↔ site et
  # API, site ↔ API (sortie autorisée : e-mails, Turnstile, Web Push, bases DB-IP).
  edge:
    enable_ipv6: true
  app:
  # data : base et Redis, sans aucun accès extérieur.
  data:
    internal: true
