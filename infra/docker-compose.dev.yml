# Services locaux de développement (pnpm infra:up). Ports liés à 127.0.0.1 uniquement.
# Mots de passe de développement local seulement : jamais réutilisés ailleurs.
name: ecine-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ecine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecine_dev_local}
      POSTGRES_DB: ecine
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ecine -d ecine']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command:
      [
        'redis-server',
        '--requirepass',
        '${REDIS_PASSWORD:-ecine_dev_local}',
        '--maxmemory',
        '128mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    ports:
      - '127.0.0.1:56379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-ecine_dev_local}', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
